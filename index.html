<style>
:root{
  --paper:#f3efe6;--paper2:#ebe5d8;--ink:#23201b;--mute:#7b7468;--line:#d6cebd;
  --red:#b5361f;--green:#3f6b47;--amber:#a8741a;--blue:#2f5576;
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.7 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
#app{max-width:760px;margin:0 auto;padding:0 16px}
h1{font-family:var(--serif);font-weight:900;font-size:34px;letter-spacing:.04em;margin:0}
.sub{color:var(--mute);font-size:13px;letter-spacing:.08em}

/* start */
#start{padding:calc(40px + env(safe-area-inset-top)) 0 0}
.startbar{position:sticky;bottom:0;z-index:4;background:var(--paper);border-top:1.5px solid var(--ink);margin:0 -16px;padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.startbar .btn{flex:1}
@media(max-width:560px){#start{padding-top:calc(14px + env(safe-area-inset-top))}h1{font-size:28px}.masthead{margin-bottom:14px}.odds{margin-top:10px}.odds b{font-size:24px}.card{padding:12px 14px;margin:10px 0 18px}.row{padding:5px 0}}
.masthead{border-bottom:3px double var(--ink);padding-bottom:14px;margin-bottom:28px}
.odds{font-family:var(--serif);font-size:15px;margin:24px 0 6px;color:var(--mute)}
.odds b{font-size:30px;color:var(--ink);font-weight:900;letter-spacing:.02em}
.card{background:#fbf9f4;border:1.5px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:18px 20px;margin:14px 0 26px}
.row{display:flex;gap:14px;padding:7px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:none}
.row .k{width:72px;flex:none;color:var(--mute);font-size:13px;padding-top:2px}
.row .v{flex:1}
.row .v small{display:block;color:var(--mute);font-size:12.5px;line-height:1.5}
.chip{display:inline-block;font-size:12px;border:1px solid var(--ink);padding:0 7px;margin:0 6px 4px 0;border-radius:2px}
.chip.rare{background:var(--red);color:#fff;border-color:var(--red)}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{border:1.5px solid var(--ink);background:transparent;padding:9px 20px;font-weight:600}
.btn:hover{background:var(--paper2)}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.primary:hover{background:#3a352d}
.gallery{margin:4px 0 24px;font-size:13px;color:var(--mute)}
.gallery .g{display:inline-block;margin:3px 6px 3px 0;padding:1px 8px;border:1px solid var(--line)}
.gallery .g.on{color:var(--ink);border-color:var(--ink)}
.gallery .g.hint{border-style:dashed;font-size:12px}
.gallery .g.tap{cursor:pointer;border-color:var(--red);color:var(--red)}
.gallery .hinttip{font-size:12px;color:var(--red);margin:6px 0 2px}
.gallery .tcat{margin:8px 0 2px;font-size:12px}
.lifebtn{width:100%;margin:2px 0 14px}
.gseg{display:inline-flex;border:1.5px solid var(--ink);margin-right:8px}.gseg button{border:0;background:transparent;padding:2px 14px;font:inherit;cursor:pointer}.gseg button.on{background:var(--ink);color:var(--paper)}
.rewindbtn{width:100%;margin-top:10px;border-color:var(--red);color:var(--red)}
.dailybtn{width:100%;margin:0 0 14px;border-color:var(--red);color:var(--red)}
.sting{font-family:var(--serif,"Noto Serif SC",serif);font-weight:700;font-size:18px;color:var(--red);margin:10px 0 4px;line-height:1.5}
.persona{border:1px solid var(--ink);padding:10px 12px;margin:10px 0;display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:baseline}
.persona small{grid-column:1/3;color:var(--mute);font-size:12px}
.persona b{font-size:20px;font-family:"Noto Serif SC",serif}
.persona span{font-size:13px;color:var(--mute)}
.gallery .rp{margin-left:5px;color:var(--mute);font-size:10px}
.rtitle{font-size:12px;color:var(--mute);margin:4px 0 8px}
.chal{border:1.5px solid var(--red);color:var(--ink);padding:10px 12px;margin:0 0 14px;font-size:14px;line-height:1.6;background:#fbf3ef}
.chal b{color:var(--red)}
#recap .life{border:1px solid var(--ink);padding:10px 12px;margin:10px 0;cursor:pointer;background:var(--paper)}
#recap .life>div:first-child{display:flex;justify-content:space-between;align-items:baseline;font-size:17px}
#recap .life small{color:var(--mute);font-size:12px}
#recap .life .rsub{margin:4px 0 0;border:0;padding:0}
#recap .lives{min-height:calc(100vh - 220px)}

/* game */
#game{padding-bottom:200px}
.top{position:sticky;top:0;padding-top:calc(12px + env(safe-area-inset-top)) !important;background:var(--paper);z-index:5;padding:12px 0 8px;border-bottom:1.5px solid var(--ink)}
.id1{font-family:var(--serif);font-weight:700;font-size:17px;line-height:1.5}
.id1 .sep{color:var(--line);margin:0 6px}
.badge{font-family:inherit;font-size:11.5px;font-weight:600;padding:0 6px;margin-left:4px;vertical-align:2px;border:1px solid}
.st0{color:var(--mute);border-color:var(--mute)}
.st1{color:var(--blue);border-color:var(--blue)}
.st2{color:var(--red);border-color:var(--red)}
.id2{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin:2px 0 8px;flex-wrap:wrap;gap:4px 12px}
.id2 b{color:var(--ink)}
.bars{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 16px}
.bar{display:flex;align-items:center;gap:6px;font-size:12px}
.bar span:first-child{width:52px;color:var(--mute)}
.bar .track{flex:1;height:5px;background:var(--paper2);position:relative}
.bar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--ink);transition:width .4s}
.bar .fill.low{background:var(--red)}
.bar .num{width:22px;text-align:right;font-family:var(--mono);font-size:11px}
.line{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px}
.line .lab{color:var(--mute);width:58px;flex:none}
.strat .lab{color:var(--mute);margin-right:4px}
.segwrap{display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
.seg{border:none;background:transparent;padding:2px 14px;font-size:12.5px;border-radius:0}
.seg+.seg{border-left:1px solid var(--ink)}
.seg.on{background:var(--ink);color:var(--paper);font-weight:600}
.seg:hover:not(.on){background:var(--paper2)}
.shint{font-size:11.5px;color:var(--mute);margin-left:4px}
.grades{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--mute)}

#log{padding:10px 0}
.ln{display:flex;gap:12px;padding:3px 0;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1}}
.ln .t{flex:none;width:76px;font-family:var(--mono);font-size:11px;color:var(--mute);padding-top:4px}
.ln .x{flex:1}
.ln .fx{display:block;font-size:12px;color:var(--mute)}
.ln.div{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
.ln.div .x{font-family:var(--serif);font-weight:700;font-size:13px;color:var(--mute);letter-spacing:.1em}
.ln.good .x{color:var(--green);font-weight:600}
.ln.bad .x{color:var(--red);font-weight:600}
.ln.warn .x{color:var(--amber)}
.ln.head .x{font-family:var(--serif);font-weight:700}
.ln.head .x::before{content:"▍";color:var(--red)}
.ln.twist{background:#fbf1ec;border-left:3px solid var(--red);padding:8px 10px;margin:6px 0}
.ln.twist .t{color:var(--red);font-weight:700}
.ln.twist .x{font-family:var(--serif);font-weight:700;color:var(--ink)}
.ln.perf .x{font-family:var(--serif);font-weight:700}

#choice{margin:14px 0 8px 88px}
@media(max-width:560px){#choice{margin-left:0}.ln .t{width:56px}.bars{grid-template-columns:repeat(2,1fr)}}
.cc{background:#fbf9f4;border:1.5px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:14px 16px}
.cc h3{margin:0 0 4px;font-family:var(--serif);font-size:16px}
.cc p{margin:0 0 12px;font-size:14px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--ink);background:transparent;padding:7px 12px;margin-top:7px}
.opt:hover{background:var(--ink);color:var(--paper)}
.opt small{display:block;font-size:12px;opacity:.7}

.dock{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1.5px solid var(--ink);z-index:6}
.dock .in{max-width:760px;margin:0 auto;padding:9px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:stretch}
.ctrl{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
@media(max-width:560px){.seg{padding:2px 11px}.dock .in{flex-wrap:wrap;gap:8px}.next{width:100%;padding:10px}.line .lab{width:34px;font-size:12px}.line .hint{display:none}.act{padding:2px 8px;font-size:12.5px}.ctrl{gap:5px}.ln .t:empty{display:none}.ln .t{width:auto;padding-right:2px}.ln{gap:6px}}
.act{border:1px solid var(--ink);background:transparent;padding:3px 10px;font-size:13px}
.act.more{border-style:dashed;color:var(--mute)}
.act:hover:not(:disabled){background:var(--paper2)}
.act:disabled,.next:disabled{opacity:.35;cursor:not-allowed}
.next{border:none;background:var(--red);color:#fff;font-weight:700;padding:12px 18px;font-size:15px;white-space:nowrap}
.next:hover:not(:disabled){background:#9a2c18}
.hint{font-size:11.5px;color:var(--mute)}
.ln.strat .x{font-weight:600}
.ln.strat .x::before{content:"⚙ ";color:var(--mute);font-weight:400}
.ln.pet .x{color:#6b5a3a}
.ln.pet .x::before{content:"🐾 "}

/* ending */
#ending{position:fixed;inset:0;background:rgba(35,32,27,.55);z-index:20;overflow:auto;padding:40px 16px}
.ec{max-width:560px;margin:0 auto;background:var(--paper);border:2px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:28px 26px}
.ec .kind{font-size:12px;letter-spacing:.2em;color:var(--mute)}
.ec h2{font-family:var(--serif);font-weight:900;font-size:32px;margin:4px 0 10px}
.ec h2.good{color:var(--green)}.ec h2.bad{color:var(--red)}.ec h2.mid{color:var(--blue)}
.ec .story{font-size:15px;margin-bottom:16px}
.ec .pct{font-family:var(--serif);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0;margin:12px 0}
.ec .pct b{font-size:26px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px;font-size:13px;margin:12px 0 16px}
.quote{font-family:var(--serif);font-size:17px;text-align:center;margin:18px 0 6px;padding:14px 10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.mini{border:1px solid var(--ink);background:transparent;font-size:12px;padding:0 8px;margin-left:6px}
.mini:hover{background:var(--ink);color:var(--paper)}
#cohort{position:fixed;inset:0;background:rgba(35,32,27,.55);z-index:25;overflow:auto;padding:30px 16px}
.cp{max-width:560px;margin:0 auto;background:var(--paper);border:2px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:22px 22px 18px}
.cp h2{font-family:var(--serif);margin:0 0 2px;font-size:22px}
.cp .sum{color:var(--mute);font-size:13px;margin-bottom:12px}
.mate{border-top:1px dashed var(--line);padding:9px 0}
.mate .nm{font-weight:600}
.mate .nm .chip{font-weight:400;margin-left:6px}
.mate .now{font-size:14px}
.mate .now.out{color:var(--blue)}.mate .now.top{color:var(--green)}
.mate .his{font-size:12px;color:var(--mute);margin-top:2px}
.ln.cohort .x{color:#5a5248}
.ln.cohort .x::before{content:"同期入职 · ";color:var(--mute);font-size:12px}
#recap{position:fixed;inset:0;background:var(--paper);z-index:24;overflow:auto}
.rc{max-width:620px;margin:0 auto;padding:calc(26px + env(safe-area-inset-top)) 18px 0}
.rc .rtop{display:flex;justify-content:space-between;align-items:center}
.rc h2{font-family:var(--serif);font-weight:900;font-size:30px;margin:0}
.rc .rsub{color:var(--mute);font-size:13px;margin:4px 0 18px;border-bottom:3px double var(--ink);padding-bottom:12px}
.tl{position:relative;margin-left:8px;padding-left:22px;border-left:1.5px solid var(--line)}
.ti{position:relative;padding:7px 0 9px;opacity:0;transform:translateY(6px);animation:rin .5s ease forwards;animation-delay:var(--d)}
.ti::before{content:"";position:absolute;left:-28px;top:13px;width:10px;height:10px;border-radius:50%;background:var(--paper);border:1.5px solid var(--ink)}
.ti .yr{font-family:var(--mono);font-size:11px;color:var(--mute)}
.ti .tx{font-size:15px;line-height:1.6}
.ti .ic{margin-right:6px}
.ti.end .tx{font-family:var(--serif);font-weight:900;font-size:22px}
.ti.end::before{background:var(--red);border-color:var(--red)}
.noanim .ti,.noanim .rend{animation:none;opacity:1;transform:none}
@keyframes rin{to{opacity:1;transform:none}}
.rend{margin:18px 0 8px;padding:16px;border:1.5px solid var(--ink);box-shadow:4px 4px 0 var(--ink);background:#fbf9f4;opacity:0;animation:rin .6s ease forwards;animation-delay:var(--d)}
.rend .pct{font-family:var(--serif);font-size:15px}.rend .pct b{font-size:24px}
.rend .q{font-family:var(--serif);font-size:17px;text-align:center;margin-top:10px}
.rbar{position:sticky;bottom:0;background:var(--paper);border-top:1.5px solid var(--ink);margin:18px -18px 0;padding:12px 18px calc(12px + env(safe-area-inset-bottom))}
.rbar .btns .btn{flex:1}
.rlinks{display:flex;justify-content:center;gap:18px;margin-top:8px;font-size:12.5px}
.rlinks a{color:var(--mute);text-decoration:underline;cursor:pointer}
.endbar{display:flex;gap:10px;width:100%}.endbar .btn{flex:1}
#share{position:fixed;inset:0;background:rgba(35,32,27,.75);z-index:30;overflow:auto;padding:24px 16px;text-align:center}
#share img{max-width:min(420px,100%);height:auto;box-shadow:6px 6px 0 rgba(0,0,0,.35);display:block;margin:0 auto}
#share .tip{color:#eee;font-size:13px;margin:12px 0}
#share .btns{justify-content:center}
#share .btn{background:var(--paper)}
#share .btn.primary{background:var(--ink);color:var(--paper)}
#share textarea{width:min(420px,100%);height:110px;margin-top:10px;font:13px/1.5 inherit;display:none}
.stats div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line)}
.stats span:first-child{color:var(--mute)}
</style>
</head>
<body>
<div id="app">
  <section id="start">
    <div class="masthead">
      <h1>大厂人生模拟器</h1>
      <div class="sub">你是数百万互联网打工人中的一个 · 从入职那天开始，按季度活下去</div>
    </div>
    <div class="chal" id="chal" hidden></div>
    <div id="daily"></div>
    <div class="chal" id="d11" hidden><b>限时 · 双十一</b>（11 月 1 日 – 15 日）<br>本期新增大促作战室、凑满减、光棍节联谊等限时事件，还有两个限定称号。</div>
    <div class="odds" id="odds"></div>
    <div class="card" id="rollcard"></div>
    <div id="livesbox"></div>
    <div class="gallery" id="gallery"></div>
    <div class="btns startbar">
      <button class="btn" id="reroll">重新投胎</button>
      <button class="btn primary" id="go">就这个了，入职！</button>
    </div>
  </section>

  <section id="game" hidden>
    <div class="top">
      <div class="id1" id="id1"></div>
      <div class="id2" id="id2"></div>
      <div class="bars" id="bars"></div>
    </div>
    <div id="log"></div>
    <div id="choice"></div>
  </section>
</div>

<div class="dock" id="dock" hidden>
  <div class="in">
    <div class="ctrl">
      <div class="line" id="strat"></div>
      <div class="line" id="actsW"></div>
      <div class="line" id="actsL"></div>
    </div>
    <button class="next" id="next">下一季度 ▸</button>
  </div>
</div>
<div id="ending" hidden></div>
<div id="share" hidden></div>
<div id="recap" hidden></div>
<div id="cohort" hidden></div>

<script>
/* ============ 工具 ============ */
const HAS_DOM = typeof document !== 'undefined';
// 存档：网页用 localStorage，微信小游戏用 wx 本地存储
const STORE = (typeof wx !== 'undefined' && wx.getStorageSync)
  ? {getItem:k=>{ try{ return wx.getStorageSync(k) || null; }catch(e){ return null; } }, setItem:(k,v)=>{ try{ wx.setStorageSync(k,v); }catch(e){} }}
  : {getItem:k=>{ try{ return localStorage.getItem(k); }catch(e){ return null; } }, setItem:(k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){} }};
let SEED_RNG = null; // 每日开局：用日期做种子，同一天所有人抽到同一个开局
const R = () => SEED_RNG ? SEED_RNG() : Math.random();
const rnd = (a,b) => a + Math.floor(R()*(b-a+1));
const rf = (a,b) => a + R()*(b-a);
const pick = a => a[Math.floor(R()*a.length)];
const clamp = (v,a=0,b=100) => Math.max(a, Math.min(b, v));
const chance = p => R() < p;
const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : 0;
const r1 = v => Math.round(v*10)/10;
const sign = v => (v>0?'+':'−') + Math.abs(r1(v));
function wpick(list, wf = x => x.w){
  const t = list.reduce((s,x)=>s+wf(x),0); let r = R()*t;
  for(const x of list){ r -= wf(x); if(r < 0) return x; }
  return list[list.length-1];
}

/* ============ 公司数据 ============
   职级 / 绩效体系参考 2023–2026 年公开报道；薪资为游戏化估算 */
const C = [
 {id:'byte',w:12,n:'某短视频大厂',tag:'一线',d:'推荐算法起家，钱给得狠，组织调整也狠',
  lv:['L1','L2','L3','L4','L5','L6','L7','L8'],pay:[38,52,72,105,165,270,430,700],exec:6,base:0,mb:0,
  g:['F','I','M-','M','M+','E','E+','O'],cut:[],dist:[.01,.03,.09,.47,.25,.11,.03,.01],rev:[2,4],promo:[4],
  work:1.25,lay:.010,stock:1,
  sys:'职级 L1–L10，校招 L1；绩效 F / I / M- / M / M+ / E / E+ / O，M 为“符合预期”；半年一评',
  biz:[['短视频主站',2,0],['直播电商',2,0],['AI 助手与大模型',1,1],['本地生活',1,.2],['海外短视频',1,0],['企业协作办公',1,-.3],['教育',0,-1],['游戏',0,-.4]]},
 {id:'kuai',w:8,n:'某二线短视频大厂',tag:'一线',d:'老铁文化，直播电商强，AI 视频生成意外起飞',
  lv:['E6','E7','E8','E9','E10','E11','E12','E13','E14'],pay:[32,40,50,64,85,120,170,260,400],exec:7,base:0,mb:0,

    roll:r, comp:c, role:r.role, fam:r.fam, edu:e, traits:r.traits, rare:r.rare,
    biz: c.biz.map(b => ({n:b[0],st:b[1],tr:b[2],eq:0,dead:false})), bizIdx:r.bizIdx,
    lvIdx: Math.min(lvIdx, c.exec-2), out: !!r.entry.out, mult: r.entry.mult||1,
    abi: rnd(...e.abi), hp: rnd(78,92), san: clamp(rnd(70,85)+(e.san||0)+(r.fam.san||0)),
    net: clamp(rnd(30,45)+(e.net||0)), boss: clamp(rnd(45,55)+(r.entry.boss||0)),
    hair: rnd(80,95), money: (r.fam.money||0) + (r.entry.money||0) + rnd(1,5),
    age, startAge:age, year:2026, q:3, turn:0, compQ:0,
    qs:[], reviews:[], grades:[], sinceProm:0, lowStreak:0, pip:false,
    blame:0, moyu:0, strat:'normal', acted:false, qmod:0, queue:[], pendingFinish:false,
    flags:(R()<.4 ? {dating:true, datingAt:-rnd(0,6)} : {}), home:{k: r.fam.money>=300 ? 'nice' : 'share', rent: r.fam.money>=300 ? 3 : .9, since:0}, cd:{}, cold:0, wave:0, visited:[], sport:{}, sAch:[], pets:[], inv:{bank:0,index:0,stock:0,us:0,pe:0}, juanStreak:0, actedW:false, actedL:false, aiRisk:false, timers:[], optGrant:0, aiVal:1, hunts:0, unemployed:false, over:false,
    st:{juan:0,moyuTot:0,q:0,companies:1,transfers:0,top:0,bottom:0,ride:false,promos:0,maxMoney:0}, log:[],
  };
  if(r.rare){
    if(r.rare.key==='kin'){ s.boss = 75; s.net = clamp(s.net-15); }
    if(r.rare.key==='genius'){ s.abi = 93; s.lvIdx = Math.min(c.exec-2, s.lvIdx+2); s.mult = 1.4; s.san -= 10; s.out=false; }
    if(r.rare.key==='vet'){ s.age = s.startAge = 33; s.lvIdx = c.exec-2; s.money += 380; s.abi = 80; s.hair = 45; s.hp -= 10; s.out=false; }
  }
  s.rollCode = rollCode(r); s.daily = r.daily || null; s.gender = r.gender === 'f' ? 'f' : 'm'; s.contacts = 0; s.chal = CHAL && CHAL.code === s.rollCode ? {e:CHAL.e} : null;
  s.cohort = makeCohort(); s.friends = []; s.others = [];
  if(HAS_DOM){ $('log').innerHTML=''; }
  log('入职', `你加入了${c.n}，${s.out?'身份是外包驻场':`职级 ${lvLabel()}（共 ${c.lv.length} 档，升到 ${c.lv[c.exec]} 算进入高管层）`}，分到「${s.biz[s.bizIdx].n}」业务（${STN[bizSt()]}），岗位是${s.role.n}。`, 'head');
  log('', `工牌照片拍得不太好看。HR 说：“欢迎加入，这里是一个特别有活力的地方。”`);
  if(s.out) log('', '你的工牌是另一种颜色，有些会议室刷不开。转正要看绩效和运气。','warn');
  if(r.rare) log('', `稀有身份：${r.rare.n}。${r.rare.d}。`,'good');
  meetFriend(pick(s.cohort), '职场发小', true);
  render();
}

/* ============ 日志 ============ */
const NAMES = {abi:'能力',hp:'健康',san:'精神',net:'人脉',boss:'老板好感',hair:'头发'};
function fx(o){
  const parts = [];
  for(const k in o){
    const v = o[k]; if(!v) continue;
    if(k==='qmod'){ s.qmod += v; parts.push(`本季表现 ${sign(v)}`); continue; }
    if(k==='money'){ s.money = r1(s.money+v); parts.push(`存款 ${sign(v)} 万`); continue; }
    s[k] = clamp(s[k]+v); parts.push(`${NAMES[k]} ${sign(v)}`);
  }
  return parts.join(' · ');
}
function tlabel(){ return `${s.year}·Q${s.q}`; }
function log(t, text, cls='', sub=''){
  s.log.push({t,text,cls,sub,y:s.year,q:s.q,age:s.age,ch:s.chapter?s.chapter.k:undefined});
  if(!HAS_DOM) return;
  const d = document.createElement('div');
  d.className = 'ln ' + cls;
  d.innerHTML = `<div class="t">${t}</div><div class="x">${text}${sub?`<span class="fx">${sub}</span>`:''}</div>`;
  $('log').appendChild(d);
}
const L = (text, sub='', cls='') => log('', text, cls, sub);
const LP = (pairs, cls='') => { const [t,e,c] = pick(pairs); L(t, fx(e), c||cls); };
function ask(title, text, opts){ if(s.over) return; s.queue.push({title,text,opts}); }

/* ============ 季度主循环 ============ */
const STRAT = {
  juan:  {n:'卷',   perf:12, hp:-3.4, san:-2.8, hair:-1.6, abi:1.5},
  normal:{n:'正常', perf:0,  hp:-1.0, san:-.9,  hair:-.5,  abi:.8},
  moyu:  {n:'摸鱼', perf:-12,hp:1.4,  san:1.4,  hair:0,    abi:.2},
};

function nextQuarter(){
  if(s.over || s.queue.length || s.unemployed) return;
  snapQuarter();
  s.turn++; s.q++; if(s.q>4){ s.q=1; s.year++; }
  s.st.q++; s.compQ++; s.sinceProm++; s.actedW=false; s.actedL=false;
  if(s.turn % 4 === 0) s.age++;
  log('', `${s.year} 年 第 ${s.q} 季度 · ${s.age} 岁`, 'div'); s.qHead = s.log.length - 1;
  if(s.chapter){ chapterQuarter(); if(s.queue.length) s.pendingFinish = true; else finishQuarter(); render(); return; }
  economy(); drift(); petTick(); hobbyTick(); evolveBiz(); cohortTick();
  if(s.q===4) settleInvest();
  // 定时事件
  s.timers = s.timers.filter(t => { if(t.at <= s.turn){ t.f(); return false; } return true; });
  if(s.over || s.unemployed){ render(); return; }
  if(s.wave > 0) s.wave--;
  if(s.blame > 0 && s.turn - (s.blameAt||0) >= 8){ s.blame--; s.blameAt = s.turn; L('时间过去了，那口旧锅渐渐没人提了。', `背锅 ${s.blame}/3`); }
  if(s.turn % 4 === 0) ageEvents();
  if(s.comp.unicorn) unicornTick();
  if(s.comp.spinoff && s.spin) spinTick();
  if(s.over) return render();
  if(!arcTick() || chance(.5)) randomEvents();
  familyTick();
  if(s.queue.length) s.pendingFinish = true; else finishQuarter();
  render();
}

function economy(){
  const inc = curPay()/4*.52;
  const cost = s.fam.cost + (s.flags.house?4:0) + (s.flags.house2?3:0) + (s.flags.kid?3:0) + (s.flags.kid2?2:0) + (s.flags.eduCost||0) + homeRent();
  s.money = r1(s.money + inc - cost);
  homeTick();
  if(s.comp.unicorn) s.optGrant += curPay()*.12;
  if(s.money < 0 && invTotal() > 0){
    let need = -s.money;
    for(const k of ['bank','index','us','stock','pe']){ const t = Math.min(need, s.inv[k]); s.inv[k] = r1(s.inv[k]-t); s.money = r1(s.money+t); need -= t; if(need<=0) break; }
    L('现金不够用了，你赎回了一部分投资。');
  }
  if(s.money < 0) s.san = clamp(s.san-2);
  s.st.maxMoney = Math.max(s.st.maxMoney, s.money);
}

function drift(){
  const st = STRAT[s.strat], w = s.comp.work;
  let hp = st.hp<0 ? st.hp*w : st.hp, san = st.san<0 ? st.san*w : st.san;
  if(s.strat==='juan' && has('卷王体质')){ hp *= .55; san *= .7; }
  const b = bizSt();
  if(b===2){ hp -= .8; san -= .4; } else if(b===0){ hp += .4; san -= .5; }
  if(s.age>=32) hp -= .5; if(s.age>=40) hp -= .8;
  if(isRare('kin')) san -= .4;
  hp += (75-s.hp)*.035; san += (62-s.san)*.04;
  s.hp = clamp(s.hp+hp); s.san = clamp(s.san+san);
  s.hair = clamp(s.hair + st.hair*(has('发量浓密')?.4:1) - (s.age>30?.3:0));
  s.abi = clamp(s.abi + st.abi*(1-s.abi/115)*(has('技术洁癖')?1.4:1));
  s.boss = clamp(s.boss + (50-s.boss)*.03);
  if(s.strat==='juan'){ s.st.juan++; s.juanStreak++; } else s.juanStreak = 0;
  if(s.strat==='moyu'){ s.moyu++; s.st.moyuTot++; } else s.moyu = 0;
}

const STRAT_MSG = {
  juan:   ['你决定从这个季度开始卷起来。', '持续生效：每季表现 +12，健康、精神、头发消耗加快，能力涨得更快'],
  normal: ['你决定回到正常节奏，按时上下班。', '持续生效：表现正常，健康和精神缓慢消耗'],
  moyu:   ['你决定开始摸鱼，保存体力。', '持续生效：每季表现 −12，健康和精神慢慢恢复，能力几乎不涨；摸鱼有被抓的风险'],
};
function setStrat(k){
  if(!s || s.over || !STRAT[k] || s.strat === k) return;
  s.strat = k;
  const m = STRAT_MSG[k];
  log('', m[0], 'strat', m[1]);
  render();
}
function qScore(){
  let v = 50 + (s.abi-55)*.55 + STRAT[s.strat].perf + (s.boss-50)*.3 + [-4,0,4][bizSt()] + s.qmod + rf(-13,13);
  if(has('卷王体质') && s.strat==='juan') v += 3;
  if(has('摸鱼大师') && s.strat==='moyu') v += 6;
  if(has('锦鲤')) v += 2;
  if(s.hp < 30) v -= 6; if(s.san < 25) v -= 6;
  return v;
}

function finishQuarter(){
  s.pendingFinish = false;
  if(s.over || s.unemployed) return;
  if(s.chapter){ chapterFinish(); if(!s.over && s.chapter) fireCheck(); return; }
  s.qs.push(qScore()); s.qmod = 0;
  if(s.comp.rev.includes(s.q)) review();
  if(s.over || s.unemployed) return;
  promoCheck();
  if(s.over) return;
  if(endChecks()) return;
  if(!s.queue.length) layoffCheck();
  if(!s.unemployed) fireCheck();
  if(!s.over && !s.unemployed && !s.queue.length) quietMerge();
}

function endChecks(){
  if(s.hp <= 0){ end('health'); return true; }
  if(s.san <= 0){ end('burnout'); return true; }
  if(s.blame >= 3){ end('blame'); return true; }
  if(s.moyu >= 40){ end('moyu'); return true; }
  if(s.age >= 60){ end(s.comp.foreign ? 'foreign' : 'fossil'); return true; }
  return false;
}

/* ============ 业务演化 ============ */
function evolveBiz(){
  const alive = s.biz.filter(b=>!b.dead);
  s.biz.forEach((b,i) => {
    if(b.dead) return;
    const mine = i === s.bizIdx;
    b.eq = b.st===0 ? b.eq+1 : 0;
    if(b.st===0 && b.tr>=.9 && chance(.035)){
      b.st = 2; b.tr = .3;
      L(`「${b.n}」突然爆了。CEO 在全员会上宣布：这是公司级一号工程。`, mine?'你所在的业务一夜之间从边缘变成了核心':'', mine?'good':'head');
      if(mine){ s.st.ride = true; fx({san:8,qmod:8}); }
      return;
    }
    if(chance(.07)){
      const up = chance(clamp(.5+.3*b.tr,.05,.95));
      const ns = clamp(b.st+(up?1:-1),0,2);
      if(ns !== b.st){
        b.st = ns;
        const txt = up ? `「${b.n}」被战略加码，升为${STN[ns]}业务。` : `「${b.n}」资源收缩，降为${STN[ns]}业务。`;
        L(txt, mine ? (up?'你的业务地位上升了':'你的业务开始被边缘化') : '', mine ? (up?'good':'warn') : '');
        if(mine && up) s.st.ride = s.st.ride || ns===2;
      }
    }
    if(b.st===0 && b.eq>=4 && alive.length>2 && chance(b.tr<0?.1:.05)){
      b.dead = true;
      if(mine){
        log('', `公司宣布：「${b.n}」整体裁撤，相关同学"妥善安置"。`, 'bad');
        ask('业务被裁撤', `你所在的「${b.n}」没了。HR 说可以内部活水，但名额有限。`, [
          {t:'抢一个活水名额', f:()=>{
            const tg = s.biz.map((x,j)=>({x,j})).filter(o=>!o.x.dead && o.j!==s.bizIdx);
            if(chance(.45+lastPv()*.3) && tg.length){ const o = pick(tg); moveBiz(o.j); L(`你抢到了「${o.x.n}」的名额。`,'','good'); }
            else { L('名额被别人抢光了。','','bad'); leaveMenu('laid'); }
          }},
          {t:'拿 N+1 走人', f:()=>leaveMenu('laid')},
          ...(s.lvIdx >= 1 && s.age <= 42 ? [{t:'跟着业务负责人出去单干', sub:'把这块业务带出去创业', f:()=>{ L(`业务负责人拉着你们几个核心成员出去单干，把「${b.n}」做成了一家新公司。`, fx({san:4})); startChapter('startup'); }}] : []),
        ]);
      } else L(`「${b.n}」被整体裁撤。`, '', 'warn');
    }
  });
}
function moveBiz(j){ if(!s.biz[j] || s.biz[j].dead) return; s.bizIdx = j; s.boss = rnd(45,58); s.st.transfers++; }

/* ============ 绩效 / 晋升 ============ */
function review(){
  const c = s.comp, sc = avg(s.qs); s.qs = [];
  if(s.out){
    if(sc >= 52 && chance(.35)){ const b0 = curPay(); s.out = false; s.lvIdx = 0; s.sinceProm = 0; L(`外包转正成功！你拿到了正式工牌：${lvLabel()}。年包 ${Math.round(b0)} 万 → ${Math.round(curPay())} 万`, fx({san:12}), 'good'); }
    else L('外包没有绩效，只有"续约"。你续上了。', '', '');
    s.reviews.push(.5); return;
  }

  let cal = rf(-16,16) + (s.boss-50)*.12 + (s.cold>s.turn?-6:0);
  const quota = chance(.35) ? (bizSt()===2 ? 6 : bizSt()===0 ? -7 : pick([-5,5])) : 0;
  const fsc = sc + cal + quota;
  let why = '';
  if(quota>0) why = '业务今年表现好，团队拿到了更多高绩效名额。';
  else if(quota<0) why = pick(['今年部门高绩效名额被砍了一半。','HR 要求严格执行强制分布，低档必须有人。']);
  if(cal>=10) why += pick(['校准会上，老板为你据理力争。','你负责的项目恰好被大老板在会上表扬了。']);
  else if(cal<=-10) why += pick(['校准会上，你的名额被让给了"更需要激励"的同事。','老板说：“今年组里名额太少，你理解一下。”','隔壁组总监在校准会上提了一句你的项目延期。','你的自评写得太谦虚了。']);
  // 强制分布：按你在同事中的百分位落档
  const peer = 60 + (s.out?0:s.lvIdx/c.exec)*14 + (isRare('genius')?6:0); // 同级同事的平均水平，职级越高越强
  const pct = normCdf((fsc - peer) / 15);
  let idx = 0, acc = 0;
  for(let i=0;i<c.dist.length;i++){ acc += c.dist[i]; if(pct <= acc){ idx = i; break; } idx = i; }
  if(isRare('kin')) idx = Math.max(idx, Math.floor((c.g.length-1)/2));
  const pv = idx/(c.g.length-1);
  s.reviews.push(pv); s.grades.push(c.g[idx]);
  const period = c.rev.length===4 ? `${s.year} Q${s.q}` : c.rev.length===2 ? `${s.year} ${s.q===2?'上半年':'下半年'}` : `${s.year} 年度`;
  const cls = pv>=.8 ? 'good' : pv===0 ? 'bad' : pv<.45 ? 'warn' : '';
  const cm = pv>=.99 ? '顶格绩效。你在工位上愣了三秒。' : pv>=.7 ? '高于预期，老板在 1:1 里夸了你。' : pv>=.4 ? '符合预期。不好不坏，就是大多数人。' : pv>0 ? '低于预期。HR 发来一封"沟通邀请"。' : '最低档。你知道这意味着什么。';
  const bm = [.7,1,1.35][bizSt()];
  const bonus = r1(curPay()*.25/c.rev.length*(.1+2.2*Math.pow(pv,1.6))*bm*.5);
  s.money = r1(s.money + bonus);
  log('', `【绩效】${period}：${c.g[idx]}`, 'perf '+cls, `${why?why+' ':''}${cm}${bonus>=.5?` 奖金到账 ${bonus} 万。`:''}`);
  if(pv>=.8) fx({san:6, boss:3}); if(pv===0) fx({san:-8});
  if(pv>=.99) s.st.top++;
  if(pv===0){ s.st.bottom++; s.lowStreak++; } else s.lowStreak = 0;
  if(s.pip){
    s.pip = false;
    if(pv===0){ L('PIP 没过。HR 把离职单推到你面前。','','bad'); leaveMenu('fired'); return; }
    L('PIP 过了。你活下来了。', fx({san:5}), 'good');
  }
  if(c.id==='ali' && s.grades.length>=2 && s.grades.slice(-2).every(g=>g==='3.75') && s.lvIdx < c.exec){
    L('连续两个季度 3.75，触发"直接晋升"规则。', '', 'good'); promote(); s.grades.push('·'); return;
  }
  if(s.lowStreak >= 2 && !isRare('kin')){
    s.lowStreak = 0;
    ask('PIP', 'HR 约你进了一个没有窗户的会议室，桌上放着一份《绩效改进计划》。', [
      {t:'签字，拼一把', sub:'下次绩效再垫底就走人', f:()=>{ s.pip = true; L('你签了字。接下来几个月你每天最后一个走。', fx({san:-6,qmod:8})); }},
      {t:'不签，跟 HR 谈补偿', f:()=>{ if(chance(.5)){ L('谈下来了 N+1。'); leaveMenu('laid'); } else { L('HR：PIP 不通过只有 N。你决定自己走。'); leaveMenu('quit'); } }},
    ]);
  }
}

function promoCheck(){
  const c = s.comp;
  if(s.out || s.lvIdx >= c.exec) return;
  const low = c.promoLow && s.lvIdx <= c.promoLow.max;
  const qs = low ? c.promoLow.q : c.promo;
  if(!qs.includes(s.q)) return;
  if(s.sinceProm < (low ? 2 : 4 + Math.floor(s.lvIdx/c.exec*6))) return;
  const rec = s.reviews.slice(-2), ap = avg(rec);
  if(!rec.length || rec[rec.length-1] === 0 || (ap < .5 && rec[rec.length-1] < .8)){ if(chance(.5)) L('今年的晋升提名名单里没有你。'); return; }
  ask('晋升答辩', `你被提名冲击 ${c.lv[s.lvIdx+1]}。评委是三位你没见过的总监。`, [
    {t:'熬夜打磨 PPT', sub:'健康 −8，通过率提高', f:()=>promoRoll(.12,{hp:-8},ap)},
    {t:'平常心去讲', f:()=>promoRoll(0,{},ap)},
    {t:'放弃，明年再说', f:()=>L('你把名额让给了组里另一位同学。', fx({boss:2,san:2}))},
  ]);
}
function promoRoll(bonus, cost, ap){
  const c = s.comp; fx(cost);
  let p = .26 + (s.abi-55)*.007 + ap*.28 + [-.12,0,.1][bizSt()] + (s.boss-50)*.004 + bonus - Math.pow(s.lvIdx/c.exec,1.3)*.45;
  if(has('PPT 之神')) p += .12; if(has('社恐')) p -= .1;
  if(s.flags.promoHelp){ p += .08; s.flags.promoHelp = false; }
  if(s.lvIdx === c.exec-1){ p *= .45; if(s.net < 55) p *= .5; }
  p = clamp(p,.04,.85);
  if(chance(p)) promote();
  else if(s.lvIdx === c.exec-1) L('高管任命的名单出来了，没有你。有人说你“业务够硬，但还差点人脉和站位”。', fx({san:-6}), 'warn');
  else L(`答辩没过。评委反馈：“${pick(['缺少体系化思考','个人贡献不够清晰','没有体现出更大的影响力','建议沉淀一下方法论'])}”`, fx({san:-6}), 'warn');
}
function promote(){
  const before = curPay();
  s.lvIdx++; s.sinceProm = 0; s.st.promos++;
  s.mult = Math.max(1, s.mult * .95); // 晋升后薪资按新职级重新定档，之前谈下来的溢价部分折算
  const after = curPay();
  L(`晋升成功：${lvLabel()}！年包 ${Math.round(before)} 万 → ${Math.round(after)} 万（+${Math.round((after/before-1)*100)}%）`, fx({san:8,net:3}), 'good');
  if(s.lvIdx >= s.comp.exec) end('exec');
}

/* ============ 裁员 / 离职 ============ */
function layoffCheck(){
  if(isRare('kin')) return;
  if(s.flags.shield && s.wave){ s.flags.shield = false; L('裁员名单公布了，你不在上面——那个转岗名额救了你。', '', 'good'); return; }
  let p = s.comp.lay * [3,1,.4][bizSt()];
  const lp = lastPv(); if(lp===0) p *= 3; else if(lp < .4) p *= 1.5;
  if(s.age>=35) p *= 2; if(s.age>=40) p *= 1.5;
  if(s.wave) p *= 3; if(s.out) p *= 2; if(s.strat==='moyu') p *= 1.4; if(s.aiRisk) p *= 1.3;
  if(chance(p)){

// 跳槽定级：最多比你现在的相对职级高一档，不能直接跳进高管前一档；薪资可以靠 mult 涨
function offerLevel(c, target){
  const rel = s.out ? 0 : s.lvIdx / s.comp.exec;
  const cap = Math.max(0, Math.min(c.exec-2, Math.round(rel*c.exec) + 1));
  let lv = 0, best = 1e9;
  c.pay.forEach((p,i) => { if(i <= cap && Math.abs(p-target) < best){ best = Math.abs(p-target); lv = i; } });
  const mult = clamp(target / c.pay[lv], 1, 1.3);
  return {lv, mult};
}
function genOffer(boost){
  const others = C.filter(c => c.id !== s.comp.id);
  const c = wpick(others);
  const target = curPay() * (s.unemployed ? rf(.85,1.1) : rf(1.15,1.4)) * boost;
  const {lv, mult} = offerLevel(c, target);
  const bw = c.biz.map(b => [2,4,3][b[1]]); const tot = bw.reduce((a,b)=>a+b,0);
  let x = R()*tot, biz = 0; for(let i=0;i<bw.length;i++){ x -= bw[i]; if(x<0){ biz = i; break; } }
  return {c, lv, biz, mult, pay: Math.round(c.pay[lv]*mult)};
}
function offerAsk(of, title, text){
  const delta = Math.round((of.pay/curPay()-1)*100);
  ask(title, text, [
    {t:`接：${of.c.n} · ${of.c.lv[of.lv]}`, sub:`「${of.c.biz[of.biz][0]}」（${STN[of.c.biz[of.biz][1]]}）· 年包约 ${of.pay} 万（${delta>=0?'+':''}${delta}%）`, f:()=>{
      if(s.lvIdx >= Math.ceil(s.comp.exec*.6) && !s.out && chance(.2)){
        ask('竞业协议', `${s.comp.n} 发来通知：你签过竞业协议，新公司在名单上。`, [
          {t:'遵守竞业，在家躺两年', f:()=>end('noncompete')},
          {t:'硬去，赌前司不追究', f:()=>{ if(chance(.4)){ L('前司起诉了你，赔了一大笔违约金。', fx({money:-rnd(60,150),san:-10}), 'bad'); } joinCompany(of); }},
        ]);
      } else joinCompany(of);
    }},
    {t:'算了，留下', f:()=>L('你把 offer 截图存进了相册，当作底气。', fx({san:3}))},
  ]);
}
function joinCompany(of){
  if(!s.unemployed) friendOnLeave();
  if(of.c.id !== 'spin') s.spin = null;
  s.comp = of.c; s.lvIdx = of.lv; s.out = false; s.mult = of.mult || 1;
  s.biz = of.c.biz.map(b => ({n:b[0],st:b[1],tr:b[2],eq:0,dead:false})); s.bizIdx = of.biz;
  s.boss = rnd(45,60); s.qs = []; s.reviews = []; s.grades = []; s.sinceProm = 0; s.lowStreak = 0; s.pip = false;
  s.compQ = 0; s.hunts = 0; s.st.companies++; s.optGrant = 0; s.aiVal = 1; s.unemployed = false;
  s.queue = []; // 前司的待办选择作废
  log('入职', `你加入了${of.c.n}，职级 ${lvLabel()}，「${s.biz[s.bizIdx].n}」业务（${STN[bizSt()]}）。`, 'head');
  friendOnJoin();
}

function startSpinoff(){
  const parent = s.comp, bn = s.biz[s.bizIdx].n, base = curPay();
  const lv = Math.min(2, Math.floor(s.lvIdx/parent.exec*4));
  const comp = {id:'spin', w:0, n:`「${bn}」独立公司`, tag:'分拆独立', d:`从${parent.n}分拆`,
    lv:['早期成员','核心骨干','业务负责人','VP','联合创始人'], pay:[.9,1.15,1.6,2.4,3.6].map(x=>Math.round(base*x)), exec:4, base:0, mb:0,
    g:['不及格','达标','超预期'], cut:[], dist:[.12,.58,.30], rev:[2,4], promo:[4], work:1.35, lay:.006, stock:1, spinoff:1,
    sys:'刚分拆出来的独立公司，股份价值取决于业绩和融资', biz:[[bn,2,.3],['新业务线',1,.6],['海外拓展',0,.6]]};
  s.spin = {parent, plv:s.lvIdx, val:1, grant:base*.8, q:0, round:0};
  joinCompany({c:comp, lv, biz:0, pay:comp.pay[lv]});
  L('你拿到了一份不小的股份。但它现在只是一张纸——要等公司跑出来才值钱。', '每轮融资、业绩和上市都会影响股份价值', 'head');
}
const ROUNDS = ['A 轮','B 轮','C 轮','Pre-IPO 轮'];
function spinTick(){
  const sp = s.spin; if(!sp) return;
  sp.q++; sp.grant += curPay()*.15;
  sp.val = Math.max(.1, sp.val * rf(.86,1.2) * (1 + (lastPv()-.5)*.1));
  if(sp.q % 4 === 0 && sp.round < ROUNDS.length){
    if(sp.val >= 1.1){ sp.val *= 1.25; L(`公司完成 ${ROUNDS[sp.round]} 融资，估值上涨。你的股份纸面价值约 ${r1(sp.grant*sp.val)} 万。`, fx({san:5}), 'good'); sp.round++; }
    else if(sp.val < .7){ L(`${ROUNDS[sp.round]} 融资没谈下来，账上的钱只够烧一年。`, fx({san:-6}), 'warn'); }
    else L(`${ROUNDS[sp.round]} 还在谈，投资人说“再看一个季度的数据”。`);
  }
  if(sp.round >= 3 && sp.val >= 1.5 && chance(.15)){
    s.spinPay = r1(sp.grant*sp.val*rf(2,3.5)); s.money = r1(s.money+s.spinPay); s.spinEnd = 'ipo';
    log('', `公司上市了！敲钟那天，你站在第二排。股份解禁后套现约 ${s.spinPay} 万。`, 'good'); end('spinoff'); return;
  }
  if(sp.round >= 1 && sp.val >= 1.2 && chance(.03)){
    ask('收购要约', `${pick(C.filter(c=>c.id!==sp.parent.id)).n} 想收购你们，按当前估值溢价 30%。`, [
      {t:'同意，套现离场', f:()=>{ s.spinPay = r1(sp.grant*sp.val*1.3); s.money = r1(s.money+s.spinPay); s.spinEnd = 'acq'; end('spinoff'); }},
      {t:'不卖，要上市', f:()=>L('创始人在全员会上说：“我们要做一家伟大的公司。”', fx({san:3}))}]);
    return;
  }
  if(sp.val < .45 && chance(.3)){
    ask('现金流断了', '公司账上的钱撑不过下个季度。母公司愿意把团队收回去，但不是所有人都能回。', [
      {t:'申请回母公司', f:()=>{ if(chance(.6)){ const p = sp.parent; s.spin = null; const e = p.biz.findIndex(b=>b[1]===0); joinCompany({c:p, lv:Math.max(0,sp.plv-1), biz:e>=0?e:0, pay:p.pay[Math.max(0,sp.plv-1)]}); L('你回到了母公司，职级降了一档。股份清零了。', fx({san:-8}), 'warn'); } else { s.spin = null; L('回去的名单里没有你。', '', 'bad'); leaveMenu('laid'); } }},
      {t:'撑到最后', f:()=>{ if(chance(.35)){ sp.val = 1; L('最后一刻，一家产业资本投了进来。公司活了。', fx({san:8}), 'good'); } else { s.spin = null; L('公司宣布清算。', '', 'bad'); leaveMenu('laid'); } }}]);
  }
}

const single = () => !s.flags.married && !s.flags.dating;
const kidAge = () => s.flags.kid ? Math.floor((s.turn - (s.flags.kidAt == null ? s.turn : s.flags.kidAt)) / 4) : -1;
const ta = () => s.gender === 'f' ? '妈妈' : '爸爸';
function strain(n){ s.flags.strain = Math.max(0, (s.flags.strain||0) + n); }
function startDating(msg){ s.flags.dating = true; s.flags.datingAt = s.turn; s.flags.strain = 0; L(msg, fx({san:6}), 'good'); }
function breakUp(msg){ s.flags.dating = false; s.flags.strain = 0; s.st.breakups = (s.st.breakups||0) + 1; L(msg, fx({san:-8}), 'bad'); }
function marry(msg){ s.flags.married = true; s.flags.dating = false; s.flags.marriedAt = s.turn; s.flags.strain = 0; L(msg, fx({san:10,money:-15}), 'good milestone'); }
function divorce(){
  s.flags.married = false; s.flags.divorced = true; s.flags.strain = 0;
  const v = r1(Math.max(0, s.money) * .4);
  if(!s.flags.house){ s.home = {k:'share', rent:HOMES.share.rent, since:s.turn}; }
  L('你们和平分开了。' + (s.flags.kid ? '孩子跟着另一半，你每两周接一次。' : '你搬回了合租房。'), fx({san:-15, money:-v}), 'bad');
}
function buyXqf(down){ s.flags.xqf = true; s.flags.xqfAsk = true; if(s.flags.house) s.flags.house2 = true; s.flags.house = true; eduAdd(2); L('你买了一套四十平米的老房子。楼道里的灯是声控的，要跺两下脚才亮。', fx({money:-down,san:-3})); }
const eduAdd = n => { s.flags.edu = (s.flags.edu||0) + n; };
const happyAdd = n => { s.flags.happy = (s.flags.happy||0) + n; };
const costAdd = n => { s.flags.eduCost = r1((s.flags.eduCost||0) + n); };

// 住处：每季度房租（万）与对状态的影响
const HOMES = {
  share:{n:'合租单间', rent:.9, san:-.6, hp:0,   d:'和三个陌生人共用一个卫生间'},
  far:  {n:'远郊一居', rent:1.1, san:-.2, hp:-.6, d:'通勤单程一个半小时'},
  near: {n:'公司附近一居', rent:1.9, san:.3, hp:.4, d:'步行十分钟到工位'},
  nice: {n:'品质小区两居', rent:3, san:.9, hp:.3, d:'有阳台，楼下有花园'},
};
const homeRent = () => s.flags.house ? 0 : (s.home ? s.home.rent : 0);
const monthly = r => Math.round(r * 10000 / 3 / 100) * 100;
function homeTick(){

// 行动按钮默认只占一行，多出来的收进「更多」
let ACT_OPEN = false;
function foldActs(){
  if(!HAS_DOM) return;
  ['actsW','actsL'].forEach(id => {
    const el = $(id), more = el && el.querySelector('.more'); if(!more) return;
    const acts = [...el.querySelectorAll('.act:not(.more)')];
    acts.forEach(a => a.style.display = ''); more.style.display = 'none';
    const top0 = acts.length ? acts[0].offsetTop : 0;
    if(!acts.some(a => a.offsetTop > top0 + 4)) return;          // 一行放得下，不需要折叠
    more.style.display = '';
    if(ACT_OPEN) return;
    for(let k = acts.length - 1; k >= 1; k--){
      if(more.offsetTop <= top0 + 4 && !acts.slice(0, k + 1).some(a => a.offsetTop > top0 + 4)) break;
      acts[k].style.display = 'none';
    }
  });
}
if(HAS_DOM) window.addEventListener('resize', () => { try{ if(s && !s.over) foldActs(); }catch(e){} });
function lifeLabel(){

let EVENTS = null;
function allEvents(){ if(!EVENTS){ EVENTS = EVENTS_BASE.concat(FRIEND_EVENTS, FAMILY_EVENTS); EVENTS.forEach((e,i) => { e.id = e.id || 'e'+i; }); } return EVENTS; }
function randomEvents(){
  const wf = e => typeof e.w==='function' ? e.w() : e.w;
  const ok = e => {
    const last = s.cd[e.id];
    if(last != null && (e.once || s.turn - last < (e.cd||8))) return false;
    return (!e.c || e.c()) && wf(e) > 0;
  };
  const fire = e => { s.cd[e.id] = s.turn; e.f(); };
  let pool = allEvents().filter(ok);
  if(chance(.9) && pool.length){ const e = wpick(pool,wf); fire(e); pool = pool.filter(x=>x!==e); }
  if(chance(.25) && pool.length && !s.unemployed && !s.over){ fire(wpick(pool,wf)); }
}

// 每隔一段时间开启一条新故事线；保证每段大厂人生至少有一两次大转折
function arcTick(){
  if(s.out && !s.arc) return false;
  if(s.over || s.unemployed || s.chapter || s.queue.length) return false;
  if(!s.arc) s.arc = {done:[], last: -2};
  const gap = s.turn - s.arc.last;
  if(gap < 5) return false;
  if(!chance(gap >= 9 ? .8 : .35)) return false;
  const pool = ARCS.filter(a => !s.arc.done.includes(a.k) && (!a.c || a.c()));
  if(!pool.length) return false;
  const a = pick(pool); s.arc.done.push(a.k); s.arc.last = s.turn; a.seed();
  return true;
}
// 平淡的季度合并成一行，转折更集中
function quietMerge(){
  if(s.qHead == null || s.log.length - 1 !== s.qHead) return;
  const h = s.log[s.qHead], prev = s.log[s.qHead - 1];
  if(prev && prev.quiet){
    prev.text = `${prev.y0} 年 Q${prev.q0} – ${s.year} 年 Q${s.q} · 风平浪静`; s.log.pop();
    if(HAS_DOM){ const el = $('log'); if(el.lastChild) el.removeChild(el.lastChild); if(el.lastChild){ const x = el.lastChild.querySelector('.x'); if(x) x.textContent = prev.text; } }
  } else {
    h.quiet = true; h.y0 = s.year; h.q0 = s.q; h.text += ' · 风平浪静';
    if(HAS_DOM){ const el = $('log').lastChild; if(el){ const x = el.querySelector('.x'); if(x) x.textContent = h.text; } }
  }
  s.qHead = null;
}

function vacationMenu(){
  const can = PLACES.filter(p => p.c <= s.money);
  const fresh = can.filter(p => !s.visited.includes(p.n)), old = can.filter(p => s.visited.includes(p.n));
  const shuffle = a => a.map(v=>[R(),v]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
  const cand = [...shuffle(fresh).slice(0,3), ...shuffle(old)].slice(0,3);
  const o = cand.map(p => ({
    t:`${p.abroad?'✈️ ':''}${p.n}`, sub:`花费约 ${p.c} 万${s.visited.includes(p.n)?' · 去过':' · 新足迹'}`,
    f:()=>goTrip(p),
  }));
  o.push({t:'哪也不去，在家躺平', sub:'不花钱，恢复少一点', f:()=>L('你请了一周假，睡到自然醒，点外卖，看完了一整部剧。', fx({hp:7,san:8,qmod:-4}))});

function goTrip(p){
  const pre = (p.q1 && s.q===1) ? p.q1 : '';
  const eff = Object.assign({hp:10, san:12+(p.abroad?3:0), qmod:-5, money:-p.c}, {});
  for(const k in (p.x||{})) eff[k] = (eff[k]||0) + p.x[k];
  if(p.q1 && s.q===1) eff.san += 4;
  L(pre + p.t, fx(eff));
  if(p.abroad && chance(.2)) L('落地第一天，老板打来电话：“方便开个短会吗？”', fx({san:-4}));
  if(!s.visited.includes(p.n)){
    s.visited.push(p.n);
    L(`点亮新足迹：${p.n}`, '', 'good');
    s.ach = s.ach || [];
    for(const a of TRAVEL_ACH) if(!s.ach.includes(a.k) && a.test(s.visited)){ s.ach.push(a.k); log('', `解锁成就「${a.n}」`, 'head'); }
  }
}

function styleFor(role){ return pick(STYLES.filter(x => role.tech ? !x.nontech : !x.tech)); }
function makeCohort(){
  const used = new Set(), list = [];
  for(let i=0;i<12;i++){
    let name; do{ name = pick(SURN)+pick(GIVN); }while(used.has(name)); used.add(name);
    const role = wpick(ROLES), st = styleFor(role);
    list.push({name, style:st, role:role.n, abi:rnd(45,80), age:s.age+rnd(-2,2), comp:s.comp, lv:Math.max(0,s.lvIdx+rnd(-1,0)), out:null, top:false, his:[], sp:0});
  }
  return list;
}
function mateNow(m){
  if(m.out) return m.out;
  return `${m.comp.n} · ${m.comp.lv[m.lv]}${m.top?'（高管）':''}`;
}
function cohortTick(){
  const news = [];
  const add = (m, txt, big) => { m.his.push(`${s.year}：${txt}`); news.push({m, txt, big}); };
  for(const m of s.cohort.concat(s.others||[])){
    if(m.out) continue;
    const age = m.age + Math.floor(s.turn/4); m.sp++;
    const st = m.style;
    m.abi = clamp(m.abi + rf(0,.8) + (st.n==='卷王'?.3:0));
    // 晋升（年底）
    if(s.q===4 && m.sp>=4 && !m.top && chance(clamp((.26 + (m.abi-55)*.008 + st.p - Math.pow(m.lv/m.comp.exec,1.3)*.45) * (m.lv===m.comp.exec-1?.35:1), .02, .8))){
      m.lv++; m.sp = 0;
      if(m.lv >= m.comp.exec){ m.top = true; add(m, `升到了 ${m.comp.lv[m.lv]}，进了高管层`, 3); }
      else add(m, `晋升到了 ${m.comp.lv[m.lv]}`, 1);
      continue;
    }
    // 裁员
    let lp = .011 * st.lay * (age>=35?2:1) * (age>=40?1.5:1) * (s.wave?2.5:1);
    if(chance(lp)){
      if(age < 40 && chance(.6)){ const c = wpick(C.filter(x=>x.id!==m.comp.id)); m.lv = Math.max(0, Math.min(c.exec-1, Math.round(m.lv/m.comp.exec*c.exec))); m.comp = c; m.sp = 0; add(m, `被裁了，后来去了${c.n}`, 2); }
      else { const e = wpick(EXITS.filter(x => !x.maxAge || age <= x.maxAge)); m.out = e.t(m); add(m, `被裁后，${m.out}`, 3); }
      continue;
    }
    // 跳槽
    if(chance(.022 * st.hop)){
      const c = wpick(C.filter(x=>x.id!==m.comp.id));
      m.lv = Math.max(0, Math.min(c.exec-2, Math.round(m.lv/m.comp.exec*c.exec)+(chance(.4)?1:0))); m.comp = c; m.sp = 0;
      add(m, `跳槽去了${c.n}，职级 ${c.lv[m.lv]}`, 1);
      continue;
    }
    // 主动离开
    let qp = (.004 + (age>=33?.008:0)) * st.quit;
    if(m.top || m.lv >= m.comp.exec-1){ if(chance(.012)){ m.out = '财务自由，提前退休，在环游世界'; add(m, m.out, 3); continue; } }
    if(chance(qp)){ const e = wpick(EXITS.filter(x => !x.maxAge || age <= x.maxAge)); m.out = e.t(m); add(m, `离开了大厂，${m.out}`, 3); continue; }
  }
  const fr = new Set((s.friends||[]).map(f=>f.p));
  const pub = news.filter(n => !fr.has(n.m) && s.cohort.includes(n.m));
  friendTick(news.filter(n => fr.has(n.m)));
  if(pub.length && chance(.65)){
    const news2 = pub; news2.sort((a,b)=>b.big-a.big);
    const n = news2[0];
    log('', `${n.m.name}${n.txt}。`, 'cohort');
  }
}
function cohortSummary(){
  const inBig = s.cohort.filter(m=>!m.out).length, top = s.cohort.filter(m=>m.top && !m.out).length;
  return `和你同一天入职的 ${s.cohort.length} 个人：${inBig} 人还在大厂${top?`（${top} 人进了高管层）`:''}，${s.cohort.length-inBig} 人已经离开。`;
}
function cohortHTML(){
  const fr = new Set((s.friends||[]).map(f=>f.p));
  return s.cohort.map(m => `<div class="mate"><div class="nm">${m.name}${fr.has(m)?'<span class="chip rare">职场发小</span>':''}<span class="chip">${m.style.n}</span><span class="chip">${m.role}</span></div>
    <div class="now ${m.out?'out':m.top?'top':''}">${mateNow(m)}</div>
    ${m.his.length?`<div class="his">${m.his.slice(-3).join(' → ')}</div>`:'<div class="his">一直在原来的岗位上</div>'}</div>`).join('');
}

function hobbyMenu(){
  const ok = HOBBIES.filter(x => x.c <= Math.max(0, s.money));
  const shuffle = a => a.map(v=>[R(),v]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
  const done = shuffle(ok.filter(x => s.sport[x.k])), fresh = shuffle(ok.filter(x => !s.sport[x.k]));
  const cand = [...done.slice(0,2), ...fresh].slice(0,4);
  const o = cand.map(x => ({ t:x.n, sub:`${s.sport[x.k] ? `玩过 ${s.sport[x.k]} 次` : '新爱好'}${x.c ? ` · 约 ${x.c} 万` : ' · 几乎免费'}`, f:()=>doSport(x) }));

}
function sportMenu(){
  const ok = SPORTS.filter(x => (!x.season || x.season.includes(s.q)) && x.c <= Math.max(0,s.money));
  const shuffle = a => a.map(v=>[R(),v]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
  const done = shuffle(ok.filter(x => s.sport[x.k])), fresh = shuffle(ok.filter(x => !s.sport[x.k]));
  const cand = [...done.slice(0,2), ...fresh].slice(0,4);
  const o = cand.map(x => ({ t:x.n, sub:`${s.sport[x.k] ? `练过 ${s.sport[x.k]} 次` : '新爱好'}${x.c ? ` · 约 ${x.c} 万` : ' · 免费'}${x.season ? ' · 季节限定' : ''}`, f:()=>doSport(x) }));

function doSport(x){
  const n = s.sport[x.k] = (s.sport[x.k]||0) + 1;
  const eff = Object.assign({}, x.fx); if(x.c) eff.money = -x.c;
  const ms = x.m[n];
  if(ms){ for(const k in (ms[1]||{})) eff[k] = (eff[k]||0) + ms[1][k]; }
  let text = ms ? ms[0] : pick(x.g);
  if(!ms && x.bossChance && text.includes('总监') ) eff.boss = 5;
  L(text, fx(eff));
  if(ms && ms[2] && !s.sAch.includes(ms[2])){ s.sAch.push(ms[2]); log('', `解锁成就「${ms[2]}」`, 'head'); }
  if(n === 3) L(`${x.n}成了你的长期爱好。之后每个季度${HOBBIES.includes(x) ? '精神' : '健康和精神'}都会慢慢变好。`, '', 'good');
  if(x.risk && chance(x.risk)) L(x.hurt, fx({hp:-5}), 'warn');
}
function hobbyTick(){
  const hob = SPORTS.concat(HOBBIES).filter(x => (s.sport[x.k]||0) >= 3).length;
  if(hob){ const sp = Math.min(SPORTS.filter(x => (s.sport[x.k]||0) >= 3).length, 2), k = Math.min(hob, 2); s.hp = clamp(s.hp + .6*sp); s.san = clamp(s.san + .5*k); }
}

function petNameOk(n){ return String(n || '').replace(/[<>&"'`\\\s]/g, '').slice(0, 8); }
function namePet(type, done){
  const unused = PETN[type].filter(n => !s.pets.some(p => p.name === n));
  const pool = unused.length >= 3 ? unused : PETN[type].map(n => n + '二世').filter(n => !s.pets.some(p => p.name === n));
  const sugg = []; while(sugg.length < 3 && sugg.length < pool.length){ const n = pick(pool); if(!sugg.includes(n)) sugg.push(n); }
  const o = sugg.map(n => ({t:`叫它「${n}」`, f:()=>done(n)}));
  if(PET_NAME_INPUT) o.push({t:'自己起名', sub:'最多 8 个字', f:()=>PET_NAME_INPUT(v => { const n = petNameOk(v); done(n && !s.pets.some(p => p.name === n) ? n : sugg[0]); })});
  o.push({t:'换一批名字', f:()=>namePet(type, done)});
  ask('给它起个名字', `这只${type}歪着头看着你。`, o);
}
function adoptPet(type, given){
  const names = PETN[type].filter(n => !s.pets.some(p=>p.name===n));
  let name = given || (names.length ? pick(names) : pick(PETN[type]) + '二世');
  while(s.pets.some(p => p.name === name)) name += '二世';
  s.pets.push({type, name, since:s.turn, next:s.turn+rnd(2,3)});
  return name;
}

function petTick(){

  s.pets.forEach((p, i) => {
    const k = i < 2 ? 1 : .25; // 多养的宠物也会陪你，但“治愈效果”不会无限叠加
    s.san = clamp(s.san + 1.2 * k);
    if(p.type==='狗') s.hp = clamp(s.hp + .8 * k);
    s.money = r1(s.money - .25);
    if(s.turn >= p.next){
      p.next = s.turn + rnd(2,3);
      if(s.juanStreak >= 4 && chance(.45)) log('', `你最近每天很晚才回家，${p.name}已经不去门口接你了。`, 'pet', fx({san:-2}));

        const all = PET_TXT[p.type].map((_,i)=>i);
        p.used = p.used || [];
        let left = all.filter(i => !p.used.includes(i));
        if(!left.length){ p.used = []; left = all; }
        const i = pick(left); p.used.push(i);
        log('', PET_TXT[p.type][i](p.name), 'pet', fx({san:rnd(3,5)}));
      }
    }
  });
}

function civilExam(c, bonus, cost){
  fx(cost);
  const p = clamp(.18 + (s.abi-50)*.007 + (s.edu.top||s.edu.good ? .06 : 0) + bonus + (c.q === 6 ? .05 : 0) + (s.strat==='juan' ? .06 : s.strat==='moyu' ? -.08 : 0), .05, .8);
  if(chance(p)){ c.data.in = true; c.data.inQ = c.q; c.len = c.q + rnd(8,11); L('成绩出来了：笔试第二，面试第一。你上岸了！', fx({san:12}), 'good milestone'); }
  else if(c.q === 2 && s.age < 35){
    L('笔试差了 1.5 分。', fx({san:-6}), 'warn');
    ask('再考一年？', '还有一次机会。', [{t:'再考一年', f:()=>L('你把错题本又抄了一遍。')}, {t:'不考了，换条路', f:()=>{ s.chapter = null; leaveMenu('again'); }}]);
  } else { L('还是没考上。你把教材送给了楼下的考研学生。', fx({san:-8}), 'bad'); s.chapter = null; leaveMenu('again'); }
}

for(const k in CH) for(const t of ['good','mid','bad']) ENDINGS[`${k}_${t}`] = {n: CH[k].ends[t][0], t: t === 'good' ? 'good' : t === 'mid' ? 'mid' : 'bad', ch: k};

function chFactors(def){
  return (def.factors||[]).map(([lab, key, w, why]) => { const v = typeof key === 'function' ? key() : s[key]; return {lab, v: Math.round(v), c: (v-55)*w, why}; });
}
function startChapter(k, opt){
  const def = CH[k];
  if(!s.unemployed && !s.chapter) friendOnLeave();
  s.queue = []; s.pendingFinish = false; s.unemployed = false;
  const fs = chFactors(def);
  const score = 45 + fs.reduce((a,f)=>a+f.c, 0) + (def.bonus ? def.bonus() : 0);
  const c = s.chapter = {k, q:0, len: rnd(def.len[0], def.len[1]), score, used: [], data: {}, opt: opt || {}};
  s.st.chapters = (s.st.chapters||0) + 1;
  log('新篇章', def.title, 'head');
  const pos = fs.filter(f=>f.c >= 3).sort((a,b)=>b.c-a.c).slice(0,2).map(f=>`＋${f.lab} ${f.v}：${f.why}`);
  const neg = fs.filter(f=>f.c <= -3).sort((a,b)=>a.c-b.c).slice(0,1).map(f=>`－${f.lab} ${f.v}：${f.why}`);
  const tn = def.traitNote ? def.traitNote() : '';
  const parts = [...pos, ...neg, ...(tn ? [tn] : [])];
  L(def.intro(c), parts.length ? '大厂经历的影响：' + parts.join('；') : '');
  if(def.start) def.start(c);
  render();
}
function chapterInfo(){
  const c = s && s.chapter; if(!c) return null;
  const def = CH[c.k];
  return {name: def.name, metric: def.metric ? def.metric(c) : '', left: Math.max(0, Math.ceil((c.len - c.q)/4))};
}
function chapterQuarter(){
  const c = s.chapter, def = CH[c.k];
  c.q++;
  const inc = def.income ? def.income(c) : 0;
  c.lastInc = inc;
  const cost = s.fam.cost + (s.flags.house?4:0) + (s.flags.house2?3:0) + (s.flags.kid?3:0) + (s.flags.kid2?2:0) + (s.flags.eduCost||0);
  s.money = r1(s.money + inc - cost);
  if(s.money < 0 && invTotal() > 0){
    let need = -s.money;
    for(const k of ['bank','index','us','stock','pe']){ const t = Math.min(need, s.inv[k]); s.inv[k] = r1(s.inv[k]-t); s.money = r1(s.money+t); need -= t; if(need <= 0) break; }
  }
  const st = STRAT[s.strat];
  s.hp = clamp(s.hp + st.hp*.8 + (75-s.hp)*.035 - (s.age >= 40 ? .6 : 0));
  s.san = clamp(s.san + st.san*.8 + (62-s.san)*.04);
  s.hair = clamp(s.hair + st.hair*.5);
  c.score += (def.strat || {juan:1.3, normal:.6, moyu:-.5})[s.strat];
  if(def.drift) def.drift(c);
  petTick(); hobbyTick(); cohortTick();
  s.timers = s.timers.filter(t => { if(t.at <= s.turn){ t.f(); return false; } return true; });
  if(s.q === 4) settleInvest();
  if(s.over || !s.chapter) return;
  if(def.tick) def.tick(c);
  if(!s.over && s.chapter && !s.queue.length && chance(.8)) chEvent(c);
}
function chEvent(c){
  const def = CH[c.k];
  const pool = def.events.map((e,i)=>({e,i})).filter(o => !c.used.includes(o.i) && (!o.e.c || o.e.c(c)));
  if(!pool.length) return;
  const o = pick(pool); c.used.push(o.i);
  const e = o.e;
  if(e.auto){ e.auto(c); return; }
  ask(e.t, e.d, e.o.map(([t, sub, f]) => ({t, sub, f:()=>f(c)})));
}
function chapterFinish(){
  const c = s.chapter; if(!c) return;
  if(s.hp <= 0){ end('health'); return; }
  if(s.san <= 0){ end('burnout'); return; }
  const def = CH[c.k];
  if(def.fail && def.fail(c)){ endChapter('bad'); return; }
  if(c.q >= c.len || s.age >= 60){
    endChapter(def.tier ? def.tier(c) : (c.score >= 70 ? 'good' : c.score >= 42 ? 'mid' : 'bad'));
  }
}
function endChapter(tier){
  const c = s.chapter, def = CH[c.k];
  if(def.onEnd) def.onEnd(c, tier);
  end(`${c.k}_${tier}`);
}

// 把日志压缩成一句话的闪回
function hlText(ic, l){
  const t = l.text; let m;
  if(ic === '🏢' && (m = t.match(/你加入了(.+?)，(?:身份是外包驻场|职级 ([^（，]+)).*?「(.+?)」/))) return `加入${m[1]}，${m[2] ? m[2].trim() : '外包驻场'}，「${m[3]}」业务`;
  if(ic === '🤝'){
    if(m = t.match(/认识了同期的(.+?)。.是个(.+?)，/)) return `认识了职场发小${m[1]}（${m[2]}）`;
    if(m = t.match(/第一周，(.+?)主动.*?是个(.+?)，/)) return `认识了饭搭子${m[1]}（${m[2]}）`;
    if(m = t.match(/撞见了(.+?)——/)) return `和${m[1]}在新公司重逢`;
  }
  if(ic === '💼' && (m = t.match(/理由是“(.+?)”/))) return `被裁员，理由是“${m[1]}”`;
  if(ic === '🚪') return '裸辞了，走出大楼时阳光很好';
  if(ic === '💸'){
    if(/杀猪盘/.test(t)){ const a = t.match(/追加到了 ([\d.]+) 万/); return a ? `遇到杀猪盘，被骗 ${a[1]} 万` : '遇到杀猪盘，被骗了一大笔'; }
    if(/群解散/.test(t)) return '跟投资群的“老师”买股票，被骗了';
    if(/再也没回过/.test(t)) return '老同学的理财产品爆雷了';
    if(/注销了/.test(t)) return '买的“原始股”打了水漂';
    if(/血本无归/.test(t)) return '私募产品暴雷，血本无归';
  }
  if(ic === '🐾' && (m = t.match(/取名「(.+?)」/))) return `${/狗/.test(t) ? '养了一只狗' : '养了一只猫'}，取名「${m[1]}」`;
  if(ic === '👋' && (m = t.match(/^你的(.+?)(去了.+?|离开了大厂，.+?)。/))) return `${m[1]}${m[2]}`;
  if(ic === '🚀' && /股份/.test(t)) return '跟着业务分拆出去，拿到了股份';
  if(ic === '🚀' && (m = t.match(/「(.+?)」突然爆了/))) return `「${m[1]}」突然爆了，成了一号工程`;
  return t.split('。')[0];
}
const HL_CAP = {'✨':5, '🌧':3, '🌟':3, '📊':3, '🏅':5, '📉':3, '🐾':2, '🤝':4};
function lifeRecord(){
  const e = ENDINGS[s.ending], d = new Date(), p2 = n => String(n).padStart(2,'0');
  return { date:`${d.getMonth()+1} 月 ${d.getDate()} 日 ${p2(d.getHours())}:${p2(d.getMinutes())}`, n:e.n, t:e.t, pct:s.pct, quote:s.quote, titles:titles(), persona:(s.persona||persona()).n, sting:s.sting||'',

    hl:lifeHighlights() };
}
function pastLives(){ try{ return JSON.parse(STORE.getItem('dc_lives')||'[]'); }catch(err){ return []; } }
function lifeHighlights(){
  const out = [], cnt = {};
  for(const l of s.log){
    if(l.y == null || (l.cls||'').includes('div')) continue;
    for(const [f, ic] of HL_RULES){
      if(!f(l)) continue;
      cnt[ic] = (cnt[ic]||0) + 1;
      if(HL_CAP[ic] && cnt[ic] > HL_CAP[ic]) break;
      let t = l.text;
      if(ic === '🏁') t = '结局：' + ENDINGS[s.ending].n;
      else if(ic === '📊') t = `这一年投资${((l.sub||'').match(/全年(盈利|亏损) [\d.]+ 万/) || [''])[0].replace('全年','')}`;
      else if(ic === '🌟' || ic === '📉') t = t.replace(/^【绩效】/, ic === '🌟' ? '顶格绩效 · ' : '最低绩效 · ');
      else t = hlText(ic, l);
      out.push({y:l.y, age:l.age, icon:ic, text:t, end: ic === '🏁'});
      break;
    }
  }
  return out;
}

    return `<div class="ti ${x.end?'end':''}" style="--d:${(i*step/1000).toFixed(2)}s"><div class="yr">${yr}</div><div class="tx"${x.end?` style="color:${cls}"`:''}><span class="ic">${x.icon}</span>${x.text}</div></div>`;
  }).join('');
  $('recap').innerHTML = `<div class="rc" id="rc">
    <div class="rtop"><h2>${past ? '那一生' : '这一生'}</h2><button class="mini" id="rskip">跳过动画</button></div>
    <div class="rsub">${past ? rec.date + ' · ' + rec.who + '<br>' : ''}${rec.sub}</div>
    <div class="tl">${items}</div>
    <div class="rend" style="--d:${((hl.length*step+300)/1000).toFixed(2)}s">
      <div class="pct">你的人生超过了 <b style="color:${cls}">${rec.pct}%</b> 的打工人</div>
      ${rec.persona ? `<div style="margin-top:6px">职场人格：<b>${rec.persona}</b></div>` : ''}${rec.sting ? `<div class="sting" style="font-size:16px">${rec.sting}</div>` : ''}
      <div style="margin-top:8px">${rec.titles.map(t=>`<span class="chip">${t}</span>`).join('')}</div>
      <div class="q">“${rec.quote}”</div>
    </div>
    ${past ? `<div class="rbar"><div class="btns"><button class="btn" id="rlives">其他几段人生</button><button class="btn primary" id="rclose">返回</button></div></div></div>` : `<div class="rbar">
      <div class="btns"><button class="btn primary" id="rshare">生成分享卡</button><button class="btn" id="ragain">重新投胎</button></div>
      <div class="rlinks"><a id="rlog">查看完整日志</a><a id="rback">返回结局</a></div>
    </div></div>`}`;
  $('recap').hidden = false; $('recap').scrollTop = 0; $('ending').hidden = true;
  $('rskip').onclick = () => { $('rc').classList.add('noanim'); };
  if(past){ $('rclose').onclick = () => { $('recap').hidden = true; }; $('rlives').onclick = showLives; return; }
  $('rshare').onclick = showShare;
  $('ragain').onclick = restartGame;
  $('rlog').onclick = () => { $('recap').hidden = true; render(); };
  $('rback').onclick = () => { $('recap').hidden = true; $('ending').hidden = false; };
}
function showLives(){
  const L5 = pastLives(); if(!L5.length) return;
  const col = t => ({good:'var(--green)',bad:'var(--red)',mid:'var(--blue)',hidden:'var(--amber)'}[t]);
  $('recap').innerHTML = `<div class="rc noanim"><div class="rtop"><h2>过往人生</h2></div><div class="rsub">最近 ${L5.length} 段人生，点开回看高光时刻</div>
    <div class="lives">${L5.map((r,i) => `<div class="life" data-i="${i}"><div><b style="color:${col(r.t)}">${r.n}</b><small>${r.date}</small></div><div class="rsub">${r.who}<br>${r.sub}</div></div>`).join('')}</div>
    <div class="rbar"><div class="btns"><button class="btn primary" id="rclose">返回</button></div></div></div>`;
  $('recap').hidden = false; $('recap').scrollTop = 0;
  $('rclose').onclick = () => { $('recap').hidden = true; };
  document.querySelectorAll('#recap .life').forEach(el => el.onclick = () => showRecap(L5[+el.dataset.i], true));
}
function shareText(){
  const e = ENDINGS[s.ending];
  return `${s.daily ? `【今日开局 · ${dailyLabel(s.daily)}】` : ''}我在《大厂人生模拟器》里活了一次：${s.edu.n}出身，在${s.comp.n}做${s.role.n}，${s.age} 岁迎来结局【${e.n}】。超过了 ${s.pct}% 的打工人，职场人格是「${(s.persona||persona()).n}」，称号：${titles().join('、')}。${s.sting || stingLine()}${challengeLine()}${cohortSummary()}\n“${s.quote}”\n\n同一个开局，你能活成什么样？${SITE}/?${challengeQuery()}`;
}
function wrap(x, text, maxW){
  const lines = []; let cur = '';
  for(const ch of text){ if(x.measureText(cur+ch).width > maxW){ lines.push(cur); cur = ch; } else cur += ch; }
  if(cur) lines.push(cur); return lines;
}
async function showShare(){
  try{ await document.fonts.ready; }catch(err){}
  const e = ENDINGS[s.ending], W = 750, H = 1600, P = 56;
  const cv = document.createElement('canvas'); cv.width = W*2; cv.height = H*2;
  const x = cv.getContext('2d'); x.scale(2,2);
  const serif = '"Noto Serif SC","Songti SC",serif', sans = '-apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
  const ink = '#23201b', mute = '#7b7468', col = {good:'#3f6b47',bad:'#b5361f',mid:'#2f5576',hidden:'#a8741a'}[e.t];
  x.fillStyle = '#f3efe6'; x.fillRect(0,0,W,H);
  let y = 96;
  x.fillStyle = ink; x.font = `900 30px ${serif}`; x.fillText('大厂人生模拟器', P, y);
  x.fillStyle = mute; x.font = `15px ${sans}`; x.textAlign = 'right'; x.fillText(`${s.year} 年 · ${s.age} 岁`, W-P, y); x.textAlign = 'left';
  y += 22; x.fillStyle = ink; x.fillRect(P, y, W-2*P, 2);
  const er = endRarity(), pe = s.persona || persona(), sting = s.sting || stingLine();
  y += 54; x.fillStyle = mute; x.font = `16px ${sans}`; x.fillText((s.daily ? `今日开局 · ${dailyLabel(s.daily)} · ` : '') + {good:'好结局',mid:'中性结局',bad:'坏结局',hidden:'隐藏结局'}[e.t] + (er ? ` · ${er} 的人生走到这里` : ''), P, y);
  y += 78; x.fillStyle = col; let fs = 72; x.font = `900 ${fs}px ${serif}`; while(fs > 36 && x.measureText(e.n).width > W-2*P){ fs -= 4; x.font = `900 ${fs}px ${serif}`; } x.fillText(e.n, P, y);
  y += 44; x.fillStyle = ink; x.font = `18px ${sans}`; x.fillText(`${s.comp.n} · ${s.role.n} · ${lvLabel()}`, P, y);
  y += 40; x.font = `19px ${sans}`; x.fillStyle = '#3a352d';
  const story = wrap(x, endText(s.ending), W-2*P).slice(0,6);
  story.forEach((l,i) => { x.fillText(i===5 && wrap(x,endText(s.ending),W-2*P).length>6 ? l.slice(0,-1)+'…' : l, P, y); y += 32; });
  y += 14; x.font = `700 26px ${serif}`; x.fillStyle = '#b5361f';
  wrap(x, sting, W-2*P).forEach(l => { x.fillText(l, P, y); y += 38; }); y -= 6;
  y += 18; x.fillStyle = ink; x.fillRect(P, y, W-2*P, 1);
  y += 58; x.font = `20px ${serif}`; x.fillText('你的人生超过了', P, y);
  const w1 = x.measureText('你的人生超过了').width + 12;
  x.font = `900 48px ${serif}`; x.fillStyle = col; x.fillText(`${s.pct}%`, P+w1, y+4);
  const w2 = x.measureText(`${s.pct}%`).width + 12;
  x.fillStyle = ink; x.font = `20px ${serif}`; x.fillText('的打工人', P+w1+w2, y);
  y += 30; x.fillRect(P, y, W-2*P, 1);
  y += 44; x.fillStyle = mute; x.font = `16px ${sans}`; x.fillText('职场人格', P, y);
  x.fillStyle = ink; x.font = `900 30px ${serif}`; x.fillText(pe.n, P + 84, y + 4);
  const pw = x.measureText(pe.n).width; x.font = `16px ${sans}`; x.fillStyle = mute; x.fillText(pe.d, P + 84 + pw + 14, y);
  y += 24; x.fillStyle = ink; x.fillRect(P, y, W-2*P, 1);
  const st = [['工作',`${Math.floor(s.st.q/4)} 年`],['身家',`${r1(s.money+invTotal())} 万`],['待过的公司',`${s.st.companies} 家`],['晋升',`${s.st.promos} 次`],['足迹',`${s.visited.length} 地`],['头发',`${Math.round(s.hair)}`]];
  y += 46; x.font = `18px ${sans}`;
  st.forEach((kv,i) => { const cx = P + (i%2)*((W-2*P)/2), cy = y + Math.floor(i/2)*42; x.fillStyle = mute; x.fillText(kv[0], cx, cy); x.fillStyle = ink; x.textAlign = 'right'; x.fillText(kv[1], cx+(W-2*P)/2-24, cy); x.textAlign = 'left'; });
  y += 3*42 + 10;
  let cx = P; x.font = `16px ${sans}`;
  for(const t of titles()){ const w = x.measureText(t).width + 24; if(cx + w > W-P){ cx = P; y += 40; } x.strokeStyle = ink; x.strokeRect(cx, y-22, w, 32); x.fillStyle = ink; x.fillText(t, cx+12, y); cx += w + 10; }
  y += 70; x.fillStyle = ink; x.fillRect(P, y-30, W-2*P, 1);
  x.font = `700 28px ${serif}`; x.textAlign = 'center';
  wrap(x, `“${s.quote}”`, W-2*P-40).forEach(l => { y += 14; x.fillText(l, W/2, y+14); y += 30; });
  const H2 = y + 150;
  x.font = `15px ${sans}`; x.fillStyle = mute; x.fillText('你也来活一次 · 大厂人生模拟器', W/2, H2-100);
  x.font = `700 26px ${serif}`; x.fillStyle = ink; x.fillText('dachang.life', W/2, H2-66); x.textAlign = 'left';
  const out = document.createElement('canvas'); out.width = W*2; out.height = H2*2;
  const o = out.getContext('2d'); o.drawImage(cv, 0, 0, W*2, H2*2, 0, 0, W*2, H2*2); o.scale(2,2);
  o.strokeStyle = ink; o.lineWidth = 3; o.strokeRect(24,24,W-48,H2-48); o.lineWidth = 1; o.strokeRect(32,32,W-64,H2-64);
  const url = out.toDataURL('image/png');
  $('share').innerHTML = `<img src="${url}" alt="分享卡"><div class="tip">长按或右键图片即可保存</div>
    <div class="btns"><button class="btn primary" id="copylink">复制挑战链接</button><button class="btn" id="copytxt">复制文字版</button><button class="btn" id="closeshare">关闭</button></div>
    <textarea id="sharetxt" readonly></textarea>`;
  $('share').hidden = false;
  $('sharetxt').value = shareText();
  $('closeshare').onclick = () => { $('share').hidden = true; };
  $('copylink').onclick = () => copyOut(`同一个开局，我的结局是【${e.n}】，你能活成什么样？${SITE}/?${challengeQuery()}`, $('copylink'));
  $('copytxt').onclick = () => copyOut(shareText(), $('copytxt'));
}
function copyOut(t, b){
  {
    const fallback = () => { const ta = $('sharetxt'); ta.value = t; ta.style.display = 'block'; ta.select(); b.textContent = '请手动复制下方文字'; };
    try{ navigator.clipboard.writeText(t).then(() => { b.textContent = '已复制'; }, fallback); }catch(err){ fallback(); }
  }
}
if(HAS_DOM){
  $('reroll').onclick = () => showRoll();
  $('go').onclick = () => { $('start').hidden = true; $('game').hidden = false; $('dock').hidden = false; startGame(curRoll); };
  $('next').onclick = nextQuarter;
  try{ const q = new URLSearchParams(location.search); if(q.get('c')) setChallenge(q.get('c'), q.get('e')); }catch(err){}
  showRoll(true);
}
if(typeof module !== 'undefined') module.exports = {roll, startGame, nextQuarter, choose, doAction, getS:()=>s, ACTIONS};
</script>
